<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Links, Social Media und Commission-Informationen."
  >

  <title>Smirka | Digital Artist</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background" aria-hidden="true">

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="background-glow glow-three"></div>

    <div class="stars stars-small"></div>
    <div class="stars stars-medium"></div>
    <div class="stars stars-large"></div>

    <span class="floating-star floating-star-one">✦</span>
    <span class="floating-star floating-star-two">✧</span>
    <span class="floating-star floating-star-three">✦</span>
    <span class="floating-star floating-star-four">✧</span>
    <span class="floating-star floating-star-five">✦</span>
    <span class="floating-star floating-star-six">✧</span>

  </div>

  <main class="page">

    <header class="profile-section">

      <div class="profile-wrapper">

        <div class="profile-orbit profile-orbit-one"></div>
        <div class="profile-orbit profile-orbit-two"></div>

        <span class="profile-spark spark-one">✦</span>
        <span class="profile-spark spark-two">✧</span>
        <span class="profile-spark spark-three">✦</span>
        <span class="profile-spark spark-four">✧</span>

        <img
          class="profile-image"
          src="images/profilbild.jpg"
          alt="Profilbild von Smirka"
        >

      </div>

      <div class="title-group">

        <h1>SMIRKA</h1>

        <p class="subtitle">
          Digital Artist
          <span>✦</span>
          Freelancer
        </p>

      </div>

    </header>

    <section class="commission-card glass-card">

      <div class="card-shine"></div>

      <div class="commission-heading">

        <span>✦</span>

        <h2>Commission Me</h2>

        <span>✦</span>

      </div>

      <!--
        OPEN:
        class="commission-status status-open"

        WAITLIST:
        class="commission-status status-waitlist"

        CLOSED:
        class="commission-status status-closed"
      -->

      <div class="commission-status status-waitlist">
        <span class="status-dot"></span>
        Open
      </div>

      <p class="slot-count">
        <strong>1 / 4</strong>
        Slots offen
      </p>

      <!-- Hier deinen Commission-Link einsetzen -->

      <a
        class="commission-button"
        href="https://vgen.co/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>✧</span>
        Commission Me
        <span>✧</span>
      </a>

    </section>

    <nav class="links" aria-label="Social-Media-Links">

      <!-- TikTok -->

      <a
        class="link-card"
        href="https://www.tiktok.com/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="link-glow"></span>

        <span class="icon-box" aria-hidden="true">

          <svg viewBox="0 0 24 24">

            <path
              d="M16.6 3c.4 2.4 1.8 3.8 4.4 4v3.2c-1.7 0-3.2-.5-4.4-1.4v6.1c0 4-2.7 6.1-5.9 6.1-3.6 0-6.2-2.8-6.2-6.1 0-3.8 3-6.4 7-6.1V12c-1.7-.2-3.5.8-3.6 2.8-.1 1.8 1.2 3 2.8 3 1.8 0 2.7-1.3 2.7-3.1V3h3.2z"
            />

          </svg>

        </span>

        <span class="link-text">
          <strong>TikTok</strong>
          <small>@deinusername</small>
        </span>

        <span class="link-star">✦</span>

      </a>

      <!-- Instagram -->

      <a
        class="link-card"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="link-glow"></span>

        <span class="icon-box" aria-hidden="true">

          <svg viewBox="0 0 24 24">

            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="5"
            />

            <circle
              cx="12"
              cy="12"
              r="4.2"
            />

            <circle
              class="filled-circle"
              cx="17.5"
              cy="6.5"
              r="1"
            />

          </svg>

        </span>

        <span class="link-text">
          <strong>Instagram</strong>
          <small>@deinusername</small>
        </span>

        <span class="link-star">✦</span>

      </a>

      <!-- YouTube -->

      <a
        class="link-card"
        href="https://www.youtube.com/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="link-glow"></span>

        <span class="icon-box" aria-hidden="true">

          <svg viewBox="0 0 24 24">

            <path
              d="M21.6 7.2c-.2-1.3-1.2-2.3-2.5-2.5C17.4 4.4 14.8 4.3 12 4.3s-5.4.1-7.1.4C3.6 4.9 2.6 5.9 2.4 7.2 2.1 8.7 2 10.3 2 12s.1 3.3.4 4.8c.2 1.3 1.2 2.3 2.5 2.5 1.7.3 4.3.4 7.1.4s5.4-.1 7.1-.4c1.3-.2 2.3-1.2 2.5-2.5.3-1.5.4-3.1.4-4.8s-.1-3.3-.4-4.8z"
            />

            <path
              class="play-icon"
              d="M10 8.8v6.4l5.5-3.2L10 8.8z"
            />

          </svg>

        </span>

        <span class="link-text">
          <strong>YouTube</strong>
          <small>Mein Kanal</small>
        </span>

        <span class="link-star">✦</span>

      </a>

      <!-- Buy Me a Coffee -->

      <a
        class="link-card"
        href="https://www.buymeacoffee.com/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="link-glow"></span>

        <span class="icon-box" aria-hidden="true">

          <svg viewBox="0 0 24 24">

            <path
              d="M5 8h12v7.2c0 3.2-2.5 5.8-5.7 5.8h-.6C7.5 21 5 18.4 5 15.2V8z"
            />

            <path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17" />

            <path d="M4 5.5h14" />

            <path d="M8 3.5h6" />

          </svg>

        </span>

        <span class="link-text">
          <strong>Buy Me a Coffee</strong>
          <small>Support my Art</small>
        </span>

        <span class="link-star">✦</span>

      </a>

    </nav>

    <footer>

      <p>
        Made with Stardust
        <span>✦</span>
        and Coffee
      </p>

      <p class="copyright">
        © 2026 Smirka
      </p>

    </footer>

  </main>

</body>
</html>
